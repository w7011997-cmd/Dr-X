<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chatify</title>
<style>
  :root {
    --bg: #0a0a0f;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --accent: #7c5cff;
    --accent-glow: rgba(124,92,255,0.4);
    --text: #eaeaf0;
    --text-dim: #8a8a9a;
    --gold: #e0b84b;
    --danger: #ff8080;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 30% 0%, #1a1230 0%, #0a0a0f 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  #join-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 16px; text-align: center;
  }
  #join-screen h1 {
    font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #b8a8ff, #7c5cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #join-screen p { color: var(--text-dim); margin: 0 0 12px; font-size: 14px; }
  .glass-input {
    width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--glass-border); background: var(--glass);
    color: var(--text); font-size: 16px; outline: none; backdrop-filter: blur(12px);
  }
  .glass-input::placeholder { color: var(--text-dim); }
  .btn {
    width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent), #5c3fd6);
    color: white; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; }
  #status-line { font-size: 13px; color: var(--text-dim); min-height: 18px; }

  #chat-screen { display: none; flex-direction: column; height: 100%; }
  #chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); gap: 8px;
  }
  #chat-header .room-info { display: flex; flex-direction: column; overflow: hidden; }
  #chat-header .room-info b { font-size: 15px; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-header .room-info span { font-size: 12px; color: var(--text-dim); }
  .admin-badge {
    font-size: 10px; font-weight: 700; color: #1a1230; background: var(--gold);
    padding: 2px 6px; border-radius: 6px; letter-spacing: 0.3px; flex-shrink: 0;
  }
  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text); font-size: 18px; display: flex;
    align-items: center; justify-content: center; position: relative;
  }
  .icon-btn.danger { color: var(--danger); border-color: rgba(255,80,80,0.3); background: rgba(255,80,80,0.1); }
  .tab-count-badge {
    position: absolute; top: -6px; right: -6px; background: var(--accent);
    color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .msg.system { align-self: center; max-width: 90%; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }
  .msg.mine { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #5c3fd6); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: var(--glass); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
  .msg .sender { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .msg .file-link { display: inline-block; margin-top: 4px; color: #cfc4ff; text-decoration: underline; font-size: 13px; }
  #input-bar {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03);
  }
  #text-input {
    flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text); font-size: 15px; outline: none;
  }
  #send-btn, #file-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: white; font-size: 18px; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  #file-btn { background: var(--glass); border: 1px solid var(--glass-border); }
  #file-input { display: none; }

  .overlay {
    position: fixed; inset: 0; background: rgba(5,5,10,0.75); backdrop-filter: blur(6px);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 480px; background: #14101f; border: 1px solid var(--glass-border);
    border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; gap: 12px;
    position: relative;
  }
  .sheet h2 { margin: 0; font-size: 17px; }
  .sheet-close { position: absolute; top: 14px; right: 16px; color: var(--text-dim); font-size: 20px; }
  .room-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .room-row {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    border-radius: 14px; background: var(--glass); border: 1px solid var(--glass-border);
  }
  .room-row.active { border-color: var(--accent); background: rgba(124,92,255,0.15); }
  .room-row .room-row-main { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: hidden; }
  .room-row .room-row-main b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-row .room-row-main span { font-size: 11px; color: var(--text-dim); }
  .room-row-close {
    width: 30px; height: 30px; border-radius: 8px; border: none; background: rgba(255,80,80,0.15);
    color: var(--danger); font-size: 14px; flex-shrink: 0; margin-left: 8px;
  }
</style>
</head>
<body>
<div id="app">

  <div id="join-screen">
    <h1>Chatify</h1>
    <p>No login. No server-side storage.<br>Chats live on this device and your peers' devices only.</p>
    <input id="room-code" class="glass-input" placeholder="Room code (share this with others)" autocomplete="off" autocapitalize="off">
    <input id="display-name" class="glass-input" placeholder="Your display name" autocomplete="off" maxlength="20">
    <button id="join-btn" class="btn">Join / Create Room</button>
    <div id="status-line"></div>
  </div>

  <div id="chat-screen">
    <div id="chat-header">
      <div class="room-info">
        <b id="room-title">Room <span id="my-admin-badge" class="admin-badge" style="display:none;">ADMIN</span></b>
        <span id="peer-count">0 connected</span>
      </div>
      <div class="header-actions">
        <button id="add-room-btn" class="icon-btn" title="Open another room">+</button>
        <button id="switcher-btn" class="icon-btn" title="Switch rooms">
          &#9633;<span id="tab-count-badge" class="tab-count-badge">1</span>
        </button>
        <button id="leave-btn" class="icon-btn danger" title="Close this room">&#10005;</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <button id="file-btn">📎</button>
      <input id="file-input" type="file">
      <input id="text-input" placeholder="Message..." autocomplete="off">
      <button id="send-btn">&#10148;</button>
    </div>
  </div>

</div>

<div id="add-room-overlay" class="overlay">
  <div class="sheet">
    <span class="sheet-close" id="add-room-close">&#10005;</span>
    <h2>Open another room</h2>
    <input id="new-room-code" class="glass-input" placeholder="Room code" autocomplete="off" autocapitalize="off" style="max-width:none;">
    <button id="new-room-join" class="btn" style="max-width:none;">Open</button>
  </div>
</div>

<div id="switcher-overlay" class="overlay">
  <div class="sheet">
    <span class="sheet-close" id="switcher-close">&#10005;</span>
    <h2>Open rooms</h2>
    <div id="room-list" class="room-list"></div>
  </div>
</div>

<script>
/* ============================================================
   Chatify — no-login, peer-to-peer group chat with multi-room
   tabs. Chat text/files travel over WebRTC data channels between
   devices. Room tabs and each room's message log are cached in
   this device's localStorage so they survive closing the app —
   nothing is ever sent to or stored on a server/database.
   ============================================================ */

const SIGNAL_SERVER_URL = 'wss://dr-x.onrender.com/';
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

const $ = (id) => document.getElementById(id);

let myId = Math.random().toString(36).slice(2, 10);
let myName = localStorage.getItem('chatify_myname') || '';
let activeRoomCode = null;
const rooms = new Map();

function getSavedRoomCodes() {
  try { return JSON.parse(localStorage.getItem('chatify_rooms') || '[]'); } catch { return []; }
}
function saveRoomCodes() {
  localStorage.setItem('chatify_rooms', JSON.stringify([...rooms.keys()]));
}
function loadRoomLog(code) {
  try { return JSON.parse(localStorage.getItem('chatify_log_' + code) || '[]'); } catch { return []; }
}
function saveRoomLog(code) {
  const room = rooms.get(code);
  if (!room) return;
  const trimmed = room.messageLog.slice(-300);
  localStorage.setItem('chatify_log_' + code, JSON.stringify(trimmed));
}

window.addEventListener('load', () => {
  const saved = getSavedRoomCodes();
  if (saved.length && myName) {
    saved.forEach((code) => openRoom(code));
    showChatScreen();
  }
});

$('join-btn').addEventListener('click', () => {
  const code = $('room-code').value.trim() || Math.random().toString(36).slice(2, 8);
  const name = $('display-name').value.trim() || 'Anon-' + myId.slice(0, 4);
  myName = name;
  localStorage.setItem('chatify_myname', myName);
  openRoom(code);
  showChatScreen();
});

$('add-room-btn').addEventListener('click', () => $('add-room-overlay').classList.add('open'));
$('add-room-close').addEventListener('click', () => $('add-room-overlay').classList.remove('open'));
$('new-room-join').addEventListener('click', () => {
  const code = $('new-room-code').value.trim();
  if (!code) return;
  if (rooms.has(code)) { switchToRoom(code); }
  else { openRoom(code); switchToRoom(code); }
  $('new-room-code').value = '';
  $('add-room-overlay').classList.remove('open');
});

$('switcher-btn').addEventListener('click', () => { renderRoomList(); $('switcher-overlay').classList.add('open'); });
$('switcher-close').addEventListener('click', () => $('switcher-overlay').classList.remove('open'));

$('leave-btn').addEventListener('click', () => closeRoom(activeRoomCode));
$('send-btn').addEventListener('click', sendText);
$('text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });
$('file-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', sendFile);

function showChatScreen() {
  $('join-screen').style.display = 'none';
  $('chat-screen').style.display = 'flex';
}
function showJoinScreen() {
  $('chat-screen').style.display = 'none';
  $('join-screen').style.display = 'flex';
}

function openRoom(code) {
  if (rooms.has(code)) { switchToRoom(code); return; }

  const room = {
    code, ws: null, peers: new Map(),
    messageLog: loadRoomLog(code),
    myIsAdmin: false, historyLoaded: false, unread: 0, connected: false
  };
  rooms.set(code, room);
  saveRoomCodes();

  const ws = new WebSocket(SIGNAL_SERVER_URL);
  room.ws = ws;

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', room: code, from: myId, name: myName }));
    room.connected = true;
    if (!activeRoomCode) switchToRoom(code);
    updateTabCountBadge();
  };
  ws.onerror = () => { addSystemMsg(code, 'Could not reach signaling server.'); };
  ws.onclose = () => { addSystemMsg(code, 'Disconnected from signaling server.'); };
  ws.onmessage = (event) => handleSignal(code, event);

  if (!activeRoomCode) activeRoomCode = code;
  updateTabCountBadge();
}

function closeRoom(code) {
  const room = rooms.get(code);
  if (!room) return;
  room.peers.forEach((p) => p.pc.close());
  if (room.ws) room.ws.close();
  rooms.delete(code);
  saveRoomCodes();
  localStorage.removeItem('chatify_log_' + code);

  if (activeRoomCode === code) {
    const remaining = [...rooms.keys()];
    if (remaining.length) { switchToRoom(remaining[0]); }
    else { activeRoomCode = null; showJoinScreen(); }
  }
  updateTabCountBadge();
}

function switchToRoom(code) {
  if (!rooms.has(code)) return;
  activeRoomCode = code;
  const room = rooms.get(code);
  room.unread = 0;
  $('room-title').childNodes[0].textContent = 'Room: ' + code + ' ';
  $('my-admin-badge').style.display = room.myIsAdmin ? 'inline-block' : 'none';
  updatePeerCount();
  renderActiveMessages();
  $('switcher-overlay').classList.remove('open');
}

function updateTabCountBadge() {
  $('tab-count-badge').textContent = rooms.size;
}

function renderRoomList() {
  const list = $('room-list');
  list.innerHTML = '';
  rooms.forEach((room, code) => {
    const row = document.createElement('div');
    row.className = 'room-row' + (code === activeRoomCode ? ' active' : '');
    row.innerHTML =
      '<div class="room-row-main">' +
        '<b>' + escapeHtml(code) + (room.myIsAdmin ? ' <span class="admin-badge">ADMIN</span>' : '') + '</b>' +
        '<span>' + (room.connected ? [...room.peers.values()].filter(p=>p.dc&&p.dc.readyState==='open').length + ' connected' : 'connecting...') + (room.unread ? ' \u00b7 ' + room.unread + ' new' : '') + '</span>' +
      '</div>' +
      '<button class="room-row-close" data-code="' + escapeHtml(code) + '">&#10005;</button>';
    row.addEventListener('click', (e) => {
      if (e.target.classList.contains('room-row-close')) return;
      switchToRoom(code);
    });
    row.querySelector('.room-row-close').addEventListener('click', (e) => {
      e.stopPropagation();
      closeRoom(code);
      renderRoomList();
    });
    list.appendChild(row);
  });
}

async function handleSignal(code, event) {
  const room = rooms.get(code);
  if (!room) return;
  const msg = JSON.parse(event.data);

  if (msg.type === 'joined') {
    room.myIsAdmin = msg.isFirst;
    if (code === activeRoomCode) $('my-admin-badge').style.display = room.myIsAdmin ? 'inline-block' : 'none';
    if (room.myIsAdmin) addSystemMsg(code, 'You are the Admin of this room.');
    return;
  }
  if (msg.from === myId) return;

  if (msg.type === 'peer-joined') {
    createPeerConnection(code, msg.from, true);
  } else if (msg.type === 'offer') {
    const pc = createPeerConnection(code, msg.from, false);
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    sendSignal(code, { type: 'answer', sdp: answer, to: msg.from });
  } else if (msg.type === 'answer') {
    const peer = room.peers.get(msg.from);
    if (peer) await peer.pc.setRemoteDescription(msg.sdp);
  } else if (msg.type === 'ice') {
    const peer = room.peers.get(msg.from);
    if (peer && msg.candidate) await peer.pc.addIceCandidate(msg.candidate);
  } else if (msg.type === 'peer-left') {
    room.peers.delete(msg.from);
    if (code === activeRoomCode) updatePeerCount();
  }
}

function sendSignal(code, obj) {
  const room = rooms.get(code);
  if (room && room.ws) room.ws.send(JSON.stringify(Object.assign({}, obj, { from: myId, room: code })));
}

function createPeerConnection(code, peerId, isInitiator) {
  const room = rooms.get(code);
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, dc: null, name: 'Peer', isAdmin: false };
  room.peers.set(peerId, peer);

  pc.onicecandidate = (e) => { if (e.candidate) sendSignal(code, { type: 'ice', candidate: e.candidate, to: peerId }); };

  if (isInitiator) {
    const dc = pc.createDataChannel('chat');
    setupDataChannel(code, dc, peerId, true);
    peer.dc = dc;
    pc.createOffer().then((offer) => {
      pc.setLocalDescription(offer);
      sendSignal(code, { type: 'offer', sdp: offer, to: peerId });
    });
  } else {
    pc.ondatachannel = (e) => { peer.dc = e.channel; setupDataChannel(code, e.channel, peerId, false); };
  }

  if (code === activeRoomCode) updatePeerCount();
  return pc;
}

function setupDataChannel(code, dc, peerId, isInitiator) {
  const room = rooms.get(code);
  dc.onopen = () => {
    const hello = { kind: 'hello', name: myName, isAdmin: room.myIsAdmin };
    if (isInitiator && !room.historyLoaded) hello.history = room.messageLog;
    dc.send(JSON.stringify(hello));
    if (code === activeRoomCode) updatePeerCount();
  };
  dc.onclose = () => { if (code === activeRoomCode) updatePeerCount(); };
  dc.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const peer = room.peers.get(peerId);

    if (data.kind === 'hello') {
      peer.name = data.name;
      peer.isAdmin = data.isAdmin;
      if (data.history && !room.historyLoaded) {
        room.historyLoaded = true;
        const existingIds = new Set(room.messageLog.map(m => m.id));
        data.history.forEach((m) => { if (!existingIds.has(m.id)) room.messageLog.push(m); });
        room.messageLog.sort((a,b) => a.ts - b.ts);
        saveRoomLog(code);
        if (code === activeRoomCode) renderActiveMessages();
      }
    } else if (data.kind === 'text') {
      const entry = { id: data.id, name: data.name, text: data.text, isAdmin: data.isAdmin, ts: data.ts };
      room.messageLog.push(entry);
      saveRoomLog(code);
      if (code === activeRoomCode) { renderMsg(entry.name, entry.text, false, entry.isAdmin); }
      else { room.unread++; }
    } else if (data.kind === 'file') {
      if (code === activeRoomCode) renderFileMsg(data.name, data.filename, data.mime, data.b64, false, data.isAdmin);
      else room.unread++;
    }
  };
}

function sendText() {
  const room = rooms.get(activeRoomCode);
  if (!room) return;
  const input = $('text-input');
  const text = input.value.trim();
  if (!text) return;
  const entry = { id: myId + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), name: myName, text: text, isAdmin: room.myIsAdmin, ts: Date.now() };
  broadcast(activeRoomCode, Object.assign({ kind: 'text' }, entry));
  room.messageLog.push(entry);
  saveRoomLog(activeRoomCode);
  renderMsg(myName, text, true, room.myIsAdmin);
  input.value = '';
}

function sendFile(e) {
  const room = rooms.get(activeRoomCode);
  if (!room) return;
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) { addSystemMsg(activeRoomCode, 'File too large for this demo (max 4MB).'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = reader.result;
    broadcast(activeRoomCode, { kind: 'file', name: myName, filename: file.name, mime: file.type, b64: b64, isAdmin: room.myIsAdmin });
    renderFileMsg(myName, file.name, file.type, b64, true, room.myIsAdmin);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function broadcast(code, obj) {
  const room = rooms.get(code);
  if (!room) return;
  const payload = JSON.stringify(obj);
  room.peers.forEach((peer) => { if (peer.dc && peer.dc.readyState === 'open') peer.dc.send(payload); });
}

function renderActiveMessages() {
  const room = rooms.get(activeRoomCode);
  const container = $('messages');
  container.innerHTML = '';
  if (!room) return;
  room.messageLog.forEach((m) => renderMsg(m.name, m.text, m.id.indexOf(myId) === 0, m.isAdmin));
}

function renderMsg(name, text, mine, isAdmin) {
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');
  const senderLine = mine ? '' :
    '<div class="sender">' + escapeHtml(name) + (isAdmin ? ' <span class="admin-badge">ADMIN</span>' : '') + '</div>';
  div.innerHTML = senderLine + escapeHtml(text);
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function renderFileMsg(name, filename, mime, b64, mine, isAdmin) {
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');
  const senderLine = mine ? '' :
    '<div class="sender">' + escapeHtml(name) + (isAdmin ? ' <span class="admin-badge">ADMIN</span>' : '') + '</div>';
  div.innerHTML = senderLine +
    '\uD83D\uDCCE ' + escapeHtml(filename) + '<br><a class="file-link" href="' + b64 + '" download="' + escapeHtml(filename) + '">Download</a>';
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function addSystemMsg(code, text) {
  if (code !== activeRoomCode) return;
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function updatePeerCount() {
  const room = rooms.get(activeRoomCode);
  const open = room ? [...room.peers.values()].filter(p => p.dc && p.dc.readyState === 'open').length : 0;
  $('peer-count').textContent = open + ' connected';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
