<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NoName</title>
<style>
  :root {
    --bg: #0a0a0f;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --accent: #7c5cff;
    --accent-glow: rgba(124,92,255,0.4);
    --text: #eaeaf0;
    --text-dim: #8a8a9a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 30% 0%, #1a1230 0%, #0a0a0f 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  #join-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 16px; text-align: center;
  }
  #join-screen h1 {
    font-size: 28px; margin: 0 0 4px; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #b8a8ff, #7c5cff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #join-screen p { color: var(--text-dim); margin: 0 0 12px; font-size: 14px; }
  .glass-input {
    width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 14px;
    border: 1px solid var(--glass-border); background: var(--glass);
    color: var(--text); font-size: 16px; outline: none; backdrop-filter: blur(12px);
  }
  .glass-input::placeholder { color: var(--text-dim); }
  .btn {
    width: 100%; max-width: 320px; padding: 14px 16px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent), #5c3fd6);
    color: white; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; }
  #status-line { font-size: 13px; color: var(--text-dim); min-height: 18px; }

  #chat-screen { display: none; flex-direction: column; height: 100%; }
  #chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03); backdrop-filter: blur(12px);
  }
  #chat-header .room-info { display: flex; flex-direction: column; }
  #chat-header .room-info b { font-size: 15px; }
  #chat-header .room-info span { font-size: 12px; color: var(--text-dim); }
  #leave-btn {
    background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.3);
    color: #ff8080; padding: 8px 14px; border-radius: 10px; font-size: 13px;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.35; word-wrap: break-word; }
  .msg.system { align-self: center; max-width: 90%; background: transparent; color: var(--text-dim); font-size: 12px; text-align: center; }
  .msg.mine { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #5c3fd6); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: var(--glass); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
  .msg .sender { font-size: 11px; color: var(--text-dim); margin-bottom: 3px; font-weight: 600; }
  .msg .file-link { display: inline-block; margin-top: 4px; color: #cfc4ff; text-decoration: underline; font-size: 13px; }
  #input-bar {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.03);
  }
  #text-input {
    flex: 1; padding: 12px 16px; border-radius: 20px; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text); font-size: 15px; outline: none;
  }
  #send-btn, #file-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--accent); color: white; font-size: 18px; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  #file-btn { background: var(--glass); border: 1px solid var(--glass-border); }
  #file-input { display: none; }
</style>
</head>
<body>
<div id="app">

  <div id="join-screen">
    <h1>NoName</h1>
    <p>No login. No storage. Nothing saved.<br>Close the tab and it's gone.</p>
    <input id="room-code" class="glass-input" placeholder="Room code (share this with others)" autocomplete="off" autocapitalize="off">
    <input id="display-name" class="glass-input" placeholder="Your display name" autocomplete="off" maxlength="20">
    <button id="join-btn" class="btn">Join / Create Room</button>
    <div id="status-line"></div>
  </div>

  <div id="chat-screen">
    <div id="chat-header">
      <div class="room-info">
        <b id="room-title">Room</b>
        <span id="peer-count">0 connected</span>
      </div>
      <button id="leave-btn">Leave</button>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <button id="file-btn">📎</button>
      <input id="file-input" type="file">
      <input id="text-input" placeholder="Message..." autocomplete="off">
      <button id="send-btn">➤</button>
    </div>
  </div>

</div>

<script>
const SIGNAL_SERVER_URL = 'wss://dr-x.onrender.com/';

const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }];

let ws = null;
let room = null;
let myId = Math.random().toString(36).slice(2, 10);
let myName = '';
const peers = new Map();

const $ = (id) => document.getElementById(id);

window.addEventListener('beforeunload', () => sessionStorage.clear());

$('join-btn').addEventListener('click', joinRoom);
$('leave-btn').addEventListener('click', () => location.reload());
$('send-btn').addEventListener('click', sendText);
$('text-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendText(); });
$('file-btn').addEventListener('click', () => $('file-input').click());
$('file-input').addEventListener('change', sendFile);

function joinRoom() {
  const code = $('room-code').value.trim() || Math.random().toString(36).slice(2, 8);
  const name = $('display-name').value.trim() || 'Anon-' + myId.slice(0, 4);
  room = code;
  myName = name;
  sessionStorage.setItem('nn_name', myName);

  $('status-line').textContent = 'Connecting...';
  ws = new WebSocket(SIGNAL_SERVER_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'join', room, from: myId, name: myName }));
    enterChat();
  };
  ws.onerror = () => { $('status-line').textContent = 'Could not reach signaling server.'; };
  ws.onclose = () => { addSystemMsg('Disconnected from signaling server.'); };
  ws.onmessage = handleSignal;
}

function enterChat() {
  $('join-screen').style.display = 'none';
  $('chat-screen').style.display = 'flex';
  $('room-title').textContent = 'Room: ' + room;
  addSystemMsg('You joined as ' + myName + '. Messages are peer-to-peer and never stored.');
}

async function handleSignal(event) {
  const msg = JSON.parse(event.data);
  if (msg.from === myId) return;

  if (msg.type === 'peer-joined') {
    createPeerConnection(msg.from, true);
  } else if (msg.type === 'offer') {
    const pc = createPeerConnection(msg.from, false);
    await pc.setRemoteDescription(msg.sdp);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    send({ type: 'answer', sdp: answer, to: msg.from });
  } else if (msg.type === 'answer') {
    const peer = peers.get(msg.from);
    if (peer) await peer.pc.setRemoteDescription(msg.sdp);
  } else if (msg.type === 'ice') {
    const peer = peers.get(msg.from);
    if (peer && msg.candidate) await peer.pc.addIceCandidate(msg.candidate);
  } else if (msg.type === 'peer-left') {
    peers.delete(msg.from);
    updatePeerCount();
  }
}

function send(obj) {
  ws.send(JSON.stringify({ ...obj, from: myId, room }));
}

function createPeerConnection(peerId, isInitiator) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  const peer = { pc, dc: null, name: 'Peer' };
  peers.set(peerId, peer);

  pc.onicecandidate = (e) => { if (e.candidate) send({ type: 'ice', candidate: e.candidate, to: peerId }); };

  if (isInitiator) {
    const dc = pc.createDataChannel('chat');
    setupDataChannel(dc, peerId);
    peer.dc = dc;
    pc.createOffer().then((offer) => {
      pc.setLocalDescription(offer);
      send({ type: 'offer', sdp: offer, to: peerId });
    });
  } else {
    pc.ondatachannel = (e) => { peer.dc = e.channel; setupDataChannel(e.channel, peerId); };
  }

  updatePeerCount();
  return pc;
}

function setupDataChannel(dc, peerId) {
  dc.onopen = () => {
    dc.send(JSON.stringify({ kind: 'hello', name: myName }));
    updatePeerCount();
  };
  dc.onclose = () => updatePeerCount();
  dc.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.kind === 'hello') {
      peers.get(peerId).name = data.name;
    } else if (data.kind === 'text') {
      renderMsg(data.name, data.text, false);
    } else if (data.kind === 'file') {
      renderFileMsg(data.name, data.filename, data.mime, data.b64, false);
    }
  };
}

function sendText() {
  const input = $('text-input');
  const text = input.value.trim();
  if (!text) return;
  broadcast({ kind: 'text', name: myName, text });
  renderMsg(myName, text, true);
  input.value = '';
}

function sendFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 4 * 1024 * 1024) { addSystemMsg('File too large for this demo (max 4MB).'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const b64 = reader.result;
    broadcast({ kind: 'file', name: myName, filename: file.name, mime: file.type, b64 });
    renderFileMsg(myName, file.name, file.type, b64, true);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function broadcast(obj) {
  const payload = JSON.stringify(obj);
  peers.forEach((peer) => { if (peer.dc && peer.dc.readyState === 'open') peer.dc.send(payload); });
}

function renderMsg(name, text, mine) {
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');
  div.innerHTML = (mine ? '' : `<div class="sender">${escapeHtml(name)}</div>`) + escapeHtml(text);
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function renderFileMsg(name, filename, mime, b64, mine) {
  const div = document.createElement('div');
  div.className = 'msg ' + (mine ? 'mine' : 'theirs');
  div.innerHTML = (mine ? '' : `<div class="sender">${escapeHtml(name)}</div>`) +
    `📎 ${escapeHtml(filename)}<br><a class="file-link" href="${b64}" download="${escapeHtml(filename)}">Download</a>`;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function updatePeerCount() {
  const open = [...peers.values()].filter(p => p.dc && p.dc.readyState === 'open').length;
  $('peer-count').textContent = open + ' connected';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
